<!DOCTYPE html>
<html>
<head>
    <title>DineEase Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .chat-container {
            width: 350px;
            margin: 50px auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .chat-header {
            background: #333;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        .chat-box {
            height: 400px;
            padding: 15px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .user {
            background: #d1e7dd;
            text-align: right;
        }

        .bot {
            background: white;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            background: white;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
        }

        .chat-input button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<a
            href="{% url 'reservations:reservation-list' %}"
            class="back-link"
        >
            ← Back to My Reservations
        </a>
<body>

<div class="chat-container">

    <div class="chat-header">
        🤖 DineEase Chatbot
    </div>

    <div id="chat-box" class="chat-box">

        <div class="message bot">
            Hello! 👋 Welcome to DineEase.
            How can I help you?
        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

function sendMessage() {

    let messageInput = document.getElementById("message");

    let message = messageInput.value.trim();

    if (message === "") {
        return;
    }

    let chatBox = document.getElementById("chat-box");

    // Show user message

    chatBox.innerHTML += `
        <div class="message user">
            ${message}
        </div>
    `;

    messageInput.value = "";


    // Send message to Django

    fetch("/chatbot/chat/", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCookie("csrftoken")
        },

        body: "message=" + encodeURIComponent(message)

    })

    .then(response => response.json())

    .then(data => {

        chatBox.innerHTML += `
            <div class="message bot">
                ${data.response}
            </div>
        `;

        chatBox.scrollTop = chatBox.scrollHeight;

    });

}


// Get CSRF token

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {

        const cookies = document.cookie.split(";");

        for (let cookie of cookies) {

            cookie = cookie.trim();

            if (cookie.substring(0, name.length + 1) === (name + "=")) {

                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

                break;
            }
        }
    }

    return cookieValue;
}

</script>

</body>
</html>
