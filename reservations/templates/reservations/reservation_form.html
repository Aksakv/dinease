
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make Reservation | DineEase</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;
            color: #333;
        }

        /* Navigation */

        .navbar {
            background-color: #333;
            color: white;

            padding: 16px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Main */

        .container {
            width: 500px;
            max-width: 90%;

            margin: 45px auto;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .page-title {
            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .page-subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        /* Django Form */

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;

            color: #333;
        }

        form input,
        form select {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;

            background-color: white;
        }

        form input:focus,
        form select:focus {
            outline: none;

            border-color: #333;

            box-shadow: 0 0 0 2px rgba(51, 51, 51, 0.08);
        }

        .helptext {
            display: block;

            margin-top: 5px;

            color: #888;

            font-size: 12px;
        }

        .errorlist {
            list-style: none;

            color: #c0392b;

            font-size: 13px;

            margin-bottom: 8px;
        }

        /* Button */

        .book-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background-color: #333;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .book-button:hover {
            background-color: #555;
        }

        /* Back Link */

        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #666;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            color: #333;

            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;

                flex-direction: column;

                gap: 12px;
            }

            .container {
                margin-top: 25px;

                padding: 25px;
            }

            .page-title {
                font-size: 24px;
            }
        }

    </style>

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="brand">
            DineEase
        </div>

        <div class="nav-links">

            <a href="{% url 'restaurants:restaurant-list' %}">
                Restaurants
            </a>

            <a href="{% url 'reservations:reservation-list' %}">
                My Reservations
            </a>

        </div>

    </nav>


    <!-- Reservation Form -->

    <div class="container">

        <h1 class="page-title">
            Make a Reservation
        </h1>

        <p class="page-subtitle">
            Select a restaurant, table, date and time to book your table.
        </p>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="book-button">
                Book Table
            </button>

        </form>


        <a
            href="{% url 'reservations:reservation-list' %}"
            class="back-link"
        >
            ← Back to My Reservations
        </a>
        <a href="{% url 'logout' %}">
    Logout
</a>
<a href="{% url 'chatbot:chat' %}" class="chatbot-link">
    💬
</a>

    </div>


    <!-- Dynamic Table Loading -->

    <script>

        const restaurantSelect =
            document.getElementById("id_restaurant");

        const tableSelect =
            document.getElementById("id_table");


        restaurantSelect.addEventListener("change", function () {

            const restaurantId = this.value;

            tableSelect.innerHTML =
                '<option value="">---------</option>';


            if (!restaurantId) {
                return;
            }


            fetch(
                `/reservations/tables/?restaurant_id=${restaurantId}`
            )

                .then(response => response.json())

                .then(data => {

                    data.forEach(table => {

                        const option =
                            document.createElement("option");

                        option.value = table.id;

                        option.textContent =
                            `Table ${table.table_number} - Capacity ${table.capacity}`;

                        tableSelect.appendChild(option);

                    });

                })

                .catch(error => {

                    console.error(
                        "Error loading tables:",
                        error
                    );

                });

        });

    </script>

</body>

</html>
