
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DineEase</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        form input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 14px;
            transition: 0.2s;
        }

        form input:focus {
            outline: none;
            border-color: #333;
            box-shadow: 0 0 0 2px rgba(51, 51, 51, 0.08);
        }

        .errorlist {
            list-style: none;
            color: #c0392b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #333;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #555;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;

            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;
            text-align: center;

            margin-top: 15px;

            font-size: 13px;
            color: #777;
            text-decoration: none;
        }

        .home-link:hover {
            color: #333;
        }

        @media (max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            DineEase
        </div>

        <p class="subtitle">
            Login to manage your table reservations
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{% url 'accounts:register' %}">
                Create an account
            </a>
        </p>

        <a href="{% url 'restaurants:restaurant-list' %}" class="home-link">
            ← Back to Restaurants
        </a>
        <a href="{% url 'logout' %}">
            <!-- <a href="{% url 'chatbot:chatbot' %}" class="chatbot-link"> -->
    <!-- 💬
</a> -->
  
</a>
<a href="{% url 'chatbot:chatbot-page' %}">
    Chatbot
</a>

    </div>

</body>
</html>
