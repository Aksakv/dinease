
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | DineEase</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 400px;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        form input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        form input:focus {
            outline: none;
            border-color: #555;
        }

        .helptext {
            display: block;
            margin-top: 5px;
            color: #777;
            font-size: 12px;
        }

        .errorlist {
            color: #c0392b;
            font-size: 13px;
            margin-bottom: 5px;
            list-style: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            DineEase
        </div>

        <p class="subtitle">
            Create your account to reserve a table
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Account
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'accounts:login' %}">
                Login
            </a>
        </p>

    </div>

</body>
</html>
